<!DOCTYPE html>
<html>
<head>
    <title>Doctors</title>
</head>
<body>

<h1>Doctors</h1>

<table border="1">
    <tr>
        <th>Name</th>
        <th>Specialization</th>
        <th>Phone</th>
    </tr>

    {% for doctor in doctors %}
    <tr>
        <td>{{ doctor.name }}</td>
        <td>{{ doctor.specialization }}</td>
        <td>{{ doctor.phone }}</td>
    </tr>
    {% endfor %}

</table>

<br>
<a href="/">← Home</a>

</body>
</html>
